<style>
:root{padding-top:env(safe-area-inset-top,0px);--bg:#f1f1ec;--card:rgba(255,255,255,.8);--ink:#292728;--mu:#6c6b58;--ln:#d0c7b3;--rose:#43442b;--rose2:#e6e1d2;--sage:#939474;--sage2:#e4e4d8;--bad:#9a5b4a}

input[type=date]{min-width:0;min-height:46px;-webkit-appearance:none;appearance:none;text-align:center;font-weight:500}
textarea.tx{min-height:52vh;border:0;background:transparent;resize:none;padding:10px 2px;outline:0;border-radius:0;font:400 18px/1.7 "Crimson Pro",Georgia,serif;overflow:hidden}
.ti{border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;padding:8px 2px;font-weight:500}.ti.l0{font-weight:600;font-size:17px;color:var(--rose)}
button{font-family:inherit}.go{width:100%;margin-top:10px;padding:13px;border:0;border-radius:999px;background:var(--rose);color:var(--bg);font:600 15px Jost,sans-serif;letter-spacing:.05em}.go.alt{background:var(--sage)}
.chip{padding:7px 13px;border:1px solid var(--ln);border-radius:999px;background:rgba(255,255,255,.9);color:var(--ink);font:500 13px Jost,sans-serif;white-space:nowrap}

.it{padding:8px 0;border-top:1px solid var(--ln)}.it:first-child{border:0}
.ent{padding:10px 0;border-top:1px solid var(--ln);display:block;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:var(--ink);font:inherit}.ent.on{color:var(--rose);font-weight:600}.ent span{display:block;color:var(--mu);font-weight:400;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--rose)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(241,241,236,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding:4px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

.cg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:4px}
.mini{display:flex;flex-direction:column;gap:5px;min-width:0;padding:10px 10px 9px;border:1px solid var(--ln);border-radius:12px;background:#fbfaf5;box-shadow:0 2px 8px rgba(41,39,40,.06);text-align:left;color:var(--ink);font:inherit;cursor:pointer}

.mh{font:600 9.5px Jost,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px}
.mt{font:600 15px/1.15 "Crimson Pro",Georgia,serif;color:var(--rose);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:2.3em}

.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border:1.5px dashed var(--ln);border-radius:14px;background:transparent;color:var(--rose);font:600 14px Jost,sans-serif;margin-bottom:10px}
.lk{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--ln);color:var(--ink);text-decoration:none;font-weight:500}.lk:first-of-type{border-top:0}
.lk b{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk span{color:var(--mu);font-size:12px}.lk svg{flex:none;color:var(--sage)}
.le{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-top:1px solid var(--ln)}.le:first-of-type{border-top:0}.le input{padding:9px 11px}.le .x{grid-row:span 2;align-self:center}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.fl label{font:500 12px Jost,sans-serif;color:var(--mu)}.fl input{margin-top:3px}
.dw{position:relative}.dw .x{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:18px}
button:focus-visible,input:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.dk,nav .brand{display:none}
@media (hover:hover){button,a{cursor:pointer}.mini{transition:transform .15s,box-shadow .15s}.mini:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(41,39,40,.12)}.chip:hover{border-color:var(--sage);background:#fff}.ent:hover{color:var(--rose)}.go:hover{filter:brightness(1.08)}.lk:hover b{color:var(--rose)}.add:hover{border-color:var(--sage);background:rgba(255,255,255,.5)}}
/* LAPTOP & DESKTOP: sidebar menu, wide photo banner, roomier cards */
@media (min-width:900px){
 :root{--sw:224px}
 nav{top:0;right:auto;width:var(--sw);flex-direction:column;gap:4px;padding:34px 16px;border-top:0;border-right:1px solid var(--ln);background:rgba(241,241,236,.88)}
 nav .brand{display:block;font:400 48px/1 "Pinyon Script",cursive;color:var(--rose);padding:0 12px 26px}
 nav button{flex:none;display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;font-size:15.5px;letter-spacing:.02em;text-align:left}
 nav svg{margin:0}nav button:hover{background:rgba(255,255,255,.55);color:var(--ink)}nav .on{background:#fff;box-shadow:0 2px 10px rgba(41,39,40,.07)}
 #bg{--m:30%;--wash:ellipse 42% 30% at 10% 50%;left:var(--sw);right:0;width:calc(100% - var(--sw));max-width:none;transform:none;aspect-ratio:auto!important;height:min(66vh,640px);background-size:cover;background-position:center 40%}
 #bg.rags{--m:45%}
 main{max-width:none;margin-left:var(--sw);padding:0 clamp(24px,4vw,56px) 64px}
 main>*{max-width:760px;margin-left:auto;margin-right:auto}
 .hero{height:clamp(190px,30vh,290px)!important;padding-bottom:18px}.hero h1{font-size:72px}.hero i{font-size:15px}
 .card{padding:24px 26px;margin-bottom:18px}.dk{display:block}
 textarea.tx{font-size:19.5px;line-height:1.75}
 .cg{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}.th{height:150px}.fl{grid-template-columns:1fr 1fr 1fr}
}
@media (min-width:1200px){
 main>*{max-width:1100px}
 .lay{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
 .side{position:sticky;top:24px}
}
</style></head><body><div id="bg"></div><main id="app"></main>
<nav id="nav"><div class="brand">Pages</div><button id="n-journal" onclick="go('journal')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2zM9 8h6M9 12h6"/></svg>Journal</button><button id="n-writing" onclick="go('writing')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-9 0-14 5-14 13l-2 3M20 4c0 7-5 12-12 12M10 14h6"/></svg>Writing</button><button id="n-rags" onclick="go('rags')"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a2 2 0 0 0 2 2H5a2 2 0 0 1-2-2z"/><path d="M17 9h3a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2"/><path d="M6 8.5h8M12 12h2M12 15h2M6 18h8"/><rect x="6" y="11.2" width="3.6" height="4" rx=".4"/></svg>Rags</button></nav>
<script>
const $=i=>document.getElementById(i),uid=()=>Math.random().toString(36).slice(2,10),pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=iso(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wc=t=>((t||'').match(/\S+/g)||[]).length,SN=['Idea','Draft','Revised','Done'];
let S={j:{},books:[],tab:'journal',date:today,bk:null,it:null,dirty:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('jw_state'))||{})}catch(e){}
S.date=today;S.books=S.books||[];S.cols=S.cols||[];S.links=S.links||[];
/* CLOUD BACKUP: uses the same Supabase project as the habit app but its own jw_snapshots table */
const SB='https://hrhlgscfgqjqslejlpqa.supabase.co',KEY='sb_publishable_GeOYErBznt6Y60TeU9oJcA_hK_Ugwyy';
let AU=null,busy=false,pt,ver=0,ST='Saved on this device';try{AU=JSON.parse(localStorage.getItem('jw_auth'))}catch(e){}
const saveAU=()=>{try{AU?localStorage.setItem('jw_auth',JSON.stringify(AU)):localStorage.removeItem('jw_auth')}catch(e){}};
const persist=()=>{try{localStorage.setItem('jw_state',JSON.stringify(S))}catch(e){}},paint=()=>document.querySelectorAll('.ss').forEach(e=>e.textContent=ST);
function save(){ver++;S.dirty=true;persist();ST=AU?'Saved · backing up soon':'Saved on this device · sign in to back up';paint();clearTimeout(pt);if(AU)pt=setTimeout(sync,2500)}
async function auth(body,grant){const r=await fetch(SB+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign-in failed');AU={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,uid:j.user.id,em:j.user.email};saveAU()}
async function sb(p,o={}){if(AU.exp-30000<Date.now())await auth({refresh_token:AU.rt},'refresh_token');const r=await fetch(SB+'/rest/v1/'+p,{...o,headers:{apikey:KEY,Authorization:'Bearer '+AU.at,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return t?JSON.parse(t):null}
const mg=(a,b)=>{const o={...a};for(const k in b)if(!o[k]||(b[k].u||0)>(o[k].u||0))o[k]=b[k];return o};
const mA=(a,b)=>{const m={};[...a,...b].forEach(x=>{if(!m[x.id]||(x.u||0)>(m[x.id].u||0))m[x.id]=x});return Object.values(m)};
async function sync(){if(!AU||busy)return;busy=true;ST='Backing up…';paint();
 try{const row=(await sb('jw_snapshots?select=data'))[0],d=row?row.data:{},r=d.jw||{};S.j=mg(S.j,r.j||{});S.books=mA(S.books,r.books||[]);const rg=d.rag||{};S.cols=mA(S.cols,rg.cols||[]);S.links=mA(S.links,rg.links||[]);const v=ver;
  await sb('jw_snapshots?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({user_id:AU.uid,data:{...d,jw:{j:S.j,books:S.books},rag:{cols:S.cols,links:S.links}},updated_at:new Date().toISOString()})});
  S.dirty=v!==ver;persist();ST='Backed up '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const a=document.activeElement;if(!a||!/^(TEXTAREA|INPUT)$/.test(a.tagName))render()}
 catch(e){ST='Backup failed ('+e.message+'). Your writing is safe on this device.'}busy=false;paint()}
async function signIn(){try{await auth({email:$('em').value.trim(),password:$('pw').value},'password');await sync();render()}catch(e){ST=e.message;paint()}}
const cloud=()=>`<div class="card"><div class="ct">Cloud backup</div>${AU?`<div class="mu">Signed in as ${esc(AU.em)}</div><div class="mu ss">${esc(ST)}</div><button class="go" onclick="sync()">Back up now</button><button class="go alt" onclick="AU=null;saveAU();render()">Sign out</button>`:`<div class="mu">Sign in once and every change is backed up automatically.</div><input id="em" type="email" placeholder="Email" autocomplete="username" style="margin-top:8px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px"><div class="mu ss">${esc(ST)}</div><button class="go" onclick="signIn()">Sign in</button>`}</div>`;
setInterval(()=>{if(AU&&S.dirty)sync()},30000);document.addEventListener('visibilitychange',()=>{if(AU&&document.hidden&&S.dirty)sync()});
/* VIEWS */
const IMG={journal:['bg-journal.jpg','900/1168',290],writing:['bg-writing.jpg','900/960',350],rags:['bg-rags.jpg','900/966',250]};
const LY=(a,b)=>`<div class="lay"><div class="pri">${a}</div><div class="side">${b}</div></div>`;
const hero=(t,s)=>`<div class="hero" style="height:${IMG[S.tab][2]}px"><h1>${t}</h1><i>${s}</i></div>`;
const grow=t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight,window.innerHeight*.5)+'px'};
const go=t=>{S.tab=t;render();scrollTo(0,0)};
const dd=n=>{const [y,m,d]=S.date.split('-');S.date=iso(new Date(+y,m-1,+d+n));render()};
const dl=d=>{const [y,m,x]=d.split('-');return new Date(+y,m-1,+x).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})};
function jv(){const t=(S.j[S.date]||{}).t||'',ks=Object.keys(S.j).filter(k=>(S.j[k].t||'').trim()).sort().reverse();
 return hero('Journal',dl(S.date))+LY(`<div class="card"><div class="row"><button class="x" onclick="dd(-1)" aria-label="Previous day">‹</button><input type="date" id="dt" value="${S.date}" onchange="if(this.value){S.date=this.value;render()}"><button class="x" onclick="dd(1)" aria-label="Next day">›</button></div>
 <textarea class="tx" id="jt" placeholder="Write about your day…" oninput="setJ(this)">${esc(t)}</textarea><div class="row mu"><span id="wc">${wc(t)} words</span><span class="ss">${esc(ST)}</span></div></div>`,`<div class="card"><div class="ct">Earlier entries</div>${ks.map(k=>`<button class="ent ${k===S.date?'on':''}" onclick="S.date='${k}';render();scrollTo(0,0)">${dl(k)}<span>${esc(S.j[k].t.trim().slice(0,90))}</span></button>`).join('')||'<div class="mu">Nothing yet. Your first entry will appear here.</div>'}</div>`+cloud())}
function setJ(t){S.j[S.date]={t:t.value,u:Date.now()};grow(t);$('wc').textContent=wc(t.value)+' words';save()}
const B=()=>S.books.find(b=>b.id===S.bk&&!b.del),touch=b=>{b.u=Date.now();save()},IT=(b,id)=>b.items.find(i=>i.id===id);
function wv(){const b=B();
 if(!b){const L=S.books.filter(x=>!x.del);return hero('Writing','Your books')+LY(`<div class="card"><div class="ct">Books</div>${L.map(x=>`<button class="ent" onclick="S.bk='${x.id}';render();scrollTo(0,0)">${esc(x.title)}<span>${x.items.reduce((n,i)=>n+wc(i.x),0).toLocaleString()} words · ${x.items.length} sections</span></button>`).join('')||'<div class="mu">No books yet. Start one below.</div>'}</div>`,`<div class="card"><div class="ct">New book</div><input id="nt" placeholder="Title"><button class="go" onclick="nb()">Start book</button></div>`+cloud())}
 const i=IT(b,S.it);if(i)return itemV(b,i);
 const tot=b.items.reduce((n,x)=>n+wc(x.x),0),p=Math.min(100,tot/(b.g||1)*100);
 return hero(esc(b.title),'Table of contents')+LY(`<div class="card"><div class="row"><button class="chip" onclick="S.bk=null;render()">‹ All books</button><button class="chip" onclick="exp()">Export .md</button></div><input class="ti l0" value="${esc(b.title)}" oninput="b_t(this.value)" aria-label="Book title" style="margin-top:8px"><div class="bar"><i style="width:${p}%"></i></div><div class="row mu"><span>${tot.toLocaleString()} of</span><input type="number" min="0" value="${b.g}" oninput="setG(this.value)" style="width:110px;padding:6px 10px" aria-label="Word goal"><span>words</span></div></div>
 <div class="card"><div class="ct">Contents</div>${b.items.map((x,n)=>`<div class="it" style="margin-left:${x.lv*16}px"><div class="row"><input class="ti l${x.lv}" value="${esc(x.t)}" oninput="setT('${x.id}',this.value)" aria-label="Section title"><button class="chip" onclick="op('${x.id}')">Write</button></div><div class="row"><span class="mu">${wc(x.x)} words</span><span><button class="chip" onclick="stat('${x.id}')">${SN[x.s]}</button><button class="x" onclick="mvI(${n},-1)" aria-label="Move up">↑</button><button class="x" onclick="mvI(${n},1)" aria-label="Move down">↓</button><button class="x" onclick="inI(${n},-1)" aria-label="Outdent">←</button><button class="x" onclick="inI(${n},1)" aria-label="Indent">→</button><button class="x" onclick="del('${x.id}')" aria-label="Delete">×</button></span></div></div>`).join('')||'<div class="mu">Empty. Add your first section.</div>'}<div class="row"><button class="go" onclick="add(0)">Add section</button><button class="go alt" onclick="add(1)">Add sub-section</button></div></div><div class="card"><button class="go alt" style="margin:0" onclick="if(confirm('Delete this book?')){b=B();b.del=1;touch(b);S.bk=null;render()}">Delete book</button></div>`,cloud())}
function itemV(b,i){const n=b.items.indexOf(i),pv=b.items[n-1],nx=b.items[n+1];
 return hero(esc(i.t),esc(b.title))+LY(`<div class="card"><div class="row"><button class="chip" onclick="S.it=null;render();scrollTo(0,0)">‹ Contents</button><button class="chip" onclick="stat('${i.id}',1)">${SN[i.s]}</button></div><input class="ti l0" value="${esc(i.t)}" oninput="setT('${i.id}',this.value)" aria-label="Section title" style="margin-top:8px"><textarea class="tx" id="xt" placeholder="Start writing…" oninput="setX(this)">${esc(i.x)}</textarea><div class="row mu"><span id="wc">${wc(i.x)} words</span><span class="ss">${esc(ST)}</span></div><div class="row" style="margin-top:10px">${pv?`<button class="chip" onclick="op('${pv.id}')">‹ ${esc(pv.t.slice(0,18))}</button>`:'<span></span>'}${nx?`<button class="chip" onclick="op('${nx.id}')">${esc(nx.t.slice(0,18))} ›</button>`:'<span></span>'}</div></div>`,`<div class="card dk"><div class="ct">Contents</div>${b.items.map(x=>`<button class="ent ${x.id===i.id?'on':''}" style="padding-left:${x.lv*14}px" onclick="op('${x.id}')">${esc(x.t||'Untitled')}<span>${wc(x.x).toLocaleString()} words · ${SN[x.s]}</span></button>`).join('')}</div>`+cloud())}
const setG=v=>{const b=B();b.g=+v||0;touch(b)},b_t=v=>{const b=B();b.title=v;touch(b)},setT=(id,v)=>{const b=B();IT(b,id).t=v;touch(b)},setX=t=>{const b=B();IT(b,S.it).x=t.value;grow(t);$('wc').textContent=wc(t.value)+' words';touch(b)};
const op=id=>{S.it=id;render();scrollTo(0,0)},stat=(id,r)=>{const b=B(),i=IT(b,id);i.s=(i.s+1)%4;touch(b);r?render():render()};
function nb(){const t=$('nt').value.trim();if(!t)return $('nt').focus();const b={id:uid(),title:t,u:Date.now(),g:80000,items:[{id:uid(),t:'Chapter 1',lv:0,s:0,x:''}]};S.books.push(b);S.bk=b.id;save();render()}
function add(d){const b=B(),l=b.items.length?b.items[b.items.length-1].lv:0,lv=Math.min(2,Math.max(0,d?l+1:l));b.items.push({id:uid(),t:'New section',lv,s:0,x:''});touch(b);render()}
const end=(a,i)=>{let j=i+1;while(j<a.length&&a[j].lv>a[i].lv)j++;return j};
function mvI(i,d){const b=B(),a=b.items,lv=a[i].lv,e=end(a,i);if(d<0){let p=i-1;while(p>=0&&a[p].lv>lv)p--;if(p<0||a[p].lv<lv)return;a.splice(p,0,...a.splice(i,e-i))}else{if(e>=a.length||a[e].lv!==lv)return;const k=end(a,e);a.splice(i,0,...a.splice(e,k-e))}touch(b);render()}
function inI(i,d){const b=B(),a=b.items,e=end(a,i),l=a[i].lv+d;if(l<0||l>2||(d>0&&i===0))return;for(let k=i;k<e;k++)a[k].lv=Math.min(2,Math.max(0,a[k].lv+d));touch(b);render()}
function del(id){const b=B(),i=IT(b,id);if(wc(i.x)>20&&!confirm('Delete "'+i.t+'" and its text?'))return;b.items=b.items.filter(x=>x.id!==id);touch(b);render()}
function exp(){const b=B(),t='# '+b.title+'\n\n'+b.items.map(i=>'#'.repeat(i.lv+2)+' '+i.t+'\n\n'+i.x).join('\n\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download=b.title.replace(/[^\w ]+/g,'')+'.md';a.click()}
/* RAGS: column ideas and drafts for the Riley Rag, plus links to the Canva drafts */
const CS=['Idea','Draft','Ready','Published'],cc=t=>(t||'').length,fmt=n=>n.toLocaleString();
const COL=()=>S.cols.find(c=>c.id===S.col&&!c.del);
const fd=d=>{if(!d)return'';const [y,m,x]=d.split('-');return new Date(+y,m-1,+x).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})};
const fs=d=>{if(!d)return'';const [y,m,x]=d.split('-'),o={month:'short',day:'numeric'};if(+y!==new Date().getFullYear())o.year='2-digit';return new Date(+y,m-1,+x).toLocaleDateString(undefined,o)};
const when=(c,f=fd)=>[c.is?'Issue № '+c.is:'',f(c.d)].filter(Boolean).join(' · ');
const iss=c=>{const n=parseFloat(c.is);return isNaN(n)?Infinity:n};
function colOrder(a,b){   // planned (by issue, then date) · then undated ideas (newest first) · published last (newest issue first)
 const g=c=>c.s===3?2:(c.is||c.d)?0:1,ga=g(a),gb=g(b);if(ga!==gb)return ga-gb;
 if(ga===1)return (b.u||0)-(a.u||0);
 const r=iss(a)-iss(b)||(a.d||'9999').localeCompare(b.d||'9999');return ga===2?-r||(b.u||0)-(a.u||0):r||(b.u||0)-(a.u||0)}
const paras=t=>t.split(/\n+/).map(x=>x.trim()).filter(Boolean);
const thumb=t=>{const P=paras(t);return P.length?P.slice(0,12).map(x=>`<p>${esc(x.slice(0,700))}</p>`).join(''):'<div class="ph" style="width:92%"></div><div class="ph"></div><div class="ph" style="width:84%"></div><div class="ph" style="width:60%"></div><div class="mu" style="font:italic 10px Jost;margin-top:8px">Nothing written yet</div>'};
const lenBar=c=>{if(!c.tg)return'';const n=cc(c.x),p=Math.min(100,n/c.tg*100);return `<div class="mb"><i class="${n>c.tg?'ov':''}" style="width:${p}%"></i></div>`};
const mini=c=>`<button class="mini${c.s===3?' pub':''}" onclick="opC('${c.id}')"><div class="mh">${esc(when(c,fs)||'Not scheduled')}</div><div class="mt">${esc(c.t||'Untitled column')}</div><div class="th">${thumb(c.x||'')}</div>${lenBar(c)}<div class="mf"><span class="tag s${c.s}">${CS[c.s]}</span><span>${fmt(cc(c.x))}${c.tg?' / '+fmt(c.tg):''} ch</span></div></button>`;
const host=u=>{try{const h=new URL(u).hostname.replace(/^www\./,'');return /canva/.test(h)?'Canva':h}catch(e){return''}};
const EXT='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
function rv(){const c=COL();if(c)return colV(c);
 const L=S.cols.filter(x=>!x.del).sort(colOrder),K=S.links.filter(x=>!x.del);
 return hero('Rags','Columns and drafts for the Riley Rag')+LY(`<div class="card"><div class="row"><div class="ct">Columns</div><span class="mu">${L.length||''}</span></div>
 <button class="add" onclick="newC()">+ New column</button>
 ${L.length?`<div class="cg">${L.map(mini).join('')}</div>`:'<div class="mu">Jot down an idea for a future edition. It doesn’t need a date yet.</div>'}</div>`,
 `<div class="card"><div class="row"><div class="ct">Drafts</div>${K.length?`<button class="chip" onclick="S.le=!S.le;render()">${S.le?'Done':'Edit'}</button>`:''}</div>
 ${S.le?K.map(k=>`<div class="le"><input value="${esc(k.n)}" aria-label="Name" oninput="setL('${k.id}','n',this.value)"><button class="x" onclick="delL('${k.id}')" aria-label="Delete">×</button><input value="${esc(k.url)}" aria-label="Link" inputmode="url" autocapitalize="off" spellcheck="false" onchange="setL('${k.id}','url',fixU(this.value))"></div>`).join('')
  :K.map(k=>`<a class="lk" href="${esc(k.url)}" target="_blank" rel="noopener"><b>${esc(k.n)}</b><span>${esc(host(k.url))}</span>${EXT}</a>`).join('')||'<div class="mu">Keep your Canva drafts here so they’re one tap away.</div>'}
 <div style="margin-top:12px;border-top:1px solid var(--ln);padding-top:12px"><input id="ln" placeholder="Name, e.g. Issue 14 layout" autocomplete="off"><input id="lu" placeholder="Paste the Canva link" inputmode="url" autocapitalize="off" spellcheck="false" style="margin-top:8px"><button class="go alt" onclick="addL()">Add draft</button></div></div>`)}
function colV(c){const n=cc(c.x),O=S.cols.filter(x=>!x.del&&x.id!==c.id).sort(colOrder);
 return hero('Column',esc(when(c)||'Not scheduled yet'))+LY(`<div class="card"><div class="row"><button class="chip" onclick="leaveC()">‹ All columns</button><button class="chip" onclick="cyc()">${CS[c.s]}</button></div>
 <input class="ti l0" value="${esc(c.t)}" placeholder="Headline" id="ct" oninput="setC('t',this.value)" style="margin-top:10px">
 <div class="fl"><label>Issue № <span style="opacity:.7">(optional)</span><input value="${esc(c.is)}" inputmode="numeric" placeholder="—" oninput="setC('is',this.value.trim())"></label>
 <label>Date <span style="opacity:.7">(optional)</span>${c.d?` · <a href="#" style="color:var(--rose)" onclick="setC('d','');render();return false">clear</a>`:''}<input type="date" value="${c.d||''}" onchange="setC('d',this.value);render()"></label>
 <label>Target length <span style="opacity:.7">(characters)</span><input value="${c.tg||''}" inputmode="numeric" placeholder="none" oninput="setC('tg',parseInt(this.value.replace(/\D/g,''))||0);cnt()"></label></div>
 <textarea class="tx" id="cx" placeholder="Start the column…" oninput="setC('x',this.value);grow(this);cnt()">${esc(c.x)}</textarea>
 <div id="cn"></div><div class="row mu" style="margin-top:4px"><span></span><span class="ss">${esc(ST)}</span></div>
 <button class="go" onclick="cpC()">Copy text</button><button class="chip" style="display:block;margin:14px auto 0;color:var(--bad)" onclick="delC()">Delete column</button></div>`,O.length?`<div class="card dk"><div class="ct">Other columns</div>${O.map(x=>`<button class="ent" onclick="swC('${x.id}')">${esc(x.t||'Untitled column')}<span>${esc([when(x,fs),CS[x.s],fmt(cc(x.x))+' ch'].filter(Boolean).join(' · '))}</span></button>`).join('')}<button class="add" style="margin:12px 0 0" onclick="leaveC();newC()">+ New column</button></div>`:'')}
function cnt(){const c=COL(),e=$('cn');if(!c||!e)return;const n=cc(c.x);e.innerHTML=`<div class="row mu"><span><b style="color:var(--rose)">${fmt(n)}</b>${c.tg?' / '+fmt(c.tg):''} characters with spaces</span><span>${fmt(wc(c.x))} words</span></div>`+(c.tg?`<div class="bar"><i style="width:${Math.min(100,n/c.tg*100)}%;${n>c.tg?'background:var(--bad)':''}"></i></div>`:'')}
function newC(){const c={id:uid(),t:'',is:'',d:'',s:0,tg:0,x:'',u:Date.now()};S.cols.push(c);S.col=c.id;save();render();scrollTo(0,0);setTimeout(()=>$('ct')&&$('ct').focus(),50)}
const opC=id=>{S.col=id;render();scrollTo(0,0)},swC=id=>{leaveC();opC(id)};
function leaveC(){const c=COL();if(c&&!c.t.trim()&&!c.x.trim()){c.del=true;c.u=Date.now();save()}S.col=null;render();scrollTo(0,0)}

const fixU=v=>{v=v.trim();return v&&!/^https?:\/\//i.test(v)?'https://'+v:v};

function delL(id){const l=S.links.find(x=>x.id===id);if(!confirm('Remove "'+l.n+'" from the list?'))return;l.del=true;l.u=Date.now();save();render()}
function render(){const y=scrollY;$('app').innerHTML=S.tab==='journal'?jv():S.tab==='rags'?rv():wv();const I=IMG[S.tab],g=$('bg');g.className=S.tab;g.style.aspectRatio=I[1];document.querySelectorAll('textarea.tx').forEach(grow);cnt();['journal','writing','rags'].forEach(t=>$('n-'+t).className=t===S.tab?'on':'');scrollTo(0,y)}
render();if(AU)sync();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
